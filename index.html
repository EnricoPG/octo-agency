<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCTO Technology Studio | Soluciones Tecnológicas para PyMEs en México</title>
    <meta name="description" content="Creamos websites, tiendas online, automatizaciones y agentes de inteligencia artificial para pequeñas y medianas empresas en México.">
    
    <!-- Fuentes: Inter para emular Neue Montreal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración de Colores de Marca (Brandbook) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        octoNegro: '#0A0A0A',
                        octoGrafito: '#161616',
                        octoPurpura: '#8A5CF6',
                        octoAcero: '#1F2433',
                        octoGris: '#3A3F4B',
                        octoBlanco: '#F7F7F8',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body { background-color: #0A0A0A; color: #F7F7F8; scroll-behavior: smooth; }
        
        /* Efecto de malla de ondas (Sección 07 Brandbook) */
        .wave-bg {
            background-image: radial-gradient(circle at 2px 2px, rgba(138, 92, 246, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .glass-card {
            background: rgba(22, 22, 22, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Animación de pulso para el logo */
        @keyframes octoPulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .logo-glow { filter: drop-shadow(0 0 8px #8A5CF6); }
    </style>
</head>
<body class="font-sans antialiased overflow-x-hidden">

    <!-- React Root -->
    <div id="root"></div>

    <!-- Scripts de React, Babel y Framer Motion para ejecución en navegador -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Componentes de la Landing Page -->
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        // Reutilizando la lógica de iconos de Lucide
        const Icon = ({ name, size = 24, className = "" }) => {
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- COMPONENTES ---

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                const onScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener("scroll", onScroll);
                lucide.createIcons();
                return () => window.removeEventListener("scroll", onScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? 'bg-octoNegro/80 backdrop-blur-xl border-b border-white/5 py-4' : 'bg-transparent py-7'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 bg-octoPurpura rounded-full flex items-center justify-center logo-glow">
                                <div className="w-4 h-4 bg-white rounded-sm rotate-45"></div>
                            </div>
                            <span className="text-xl font-black tracking-[0.3em] text-white">OCTO</span>
                        </div>
                        <div className="hidden md:flex gap-10 items-center">
                            {['Inicio', 'Soluciones', 'Proyectos', 'Contacto'].map(link => (
                                <a key={link} href={`#${link.toLowerCase()}`} className="text-[11px] font-bold uppercase tracking-[0.2em] text-octoGris hover:text-octoPurpura transition-colors">
                                    {link}
                                </a>
                            ))}
                            <button className="bg-octoPurpura hover:bg-octoPurpura/80 text-white px-7 py-2.5 rounded-full text-[11px] font-bold tracking-widest transition-all">
                                HABLEMOS
                            </button>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section id="inicio" className="relative min-h-screen flex items-center pt-20 wave-bg overflow-hidden">
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-octoPurpura/5 blur-[120px] rounded-full pointer-events-none"></div>
                <div className="container mx-auto px-6 relative z-10">
                    <motion.div 
                        initial={{ opacity: 0, y: 30 }}
                        animate={{ opacity: 1, y: 0 }}
                        transition={{ duration: 1 }}
                        className="max-w-4xl"
                    >
                        <span className="text-octoPurpura font-bold tracking-[0.4em] uppercase text-[10px] mb-6 block">Technology Studio</span>
                        <h1 className="text-5xl md:text-8xl font-black leading-[1.05] mb-8 tracking-tighter">
                            Tecnología que hace crecer <span className="text-octoPurpura">tu negocio.</span>
                        </h1>
                        <p className="text-octoGris text-lg md:text-xl max-w-2xl mb-12 leading-relaxed">
                            Diseñamos e integramos soluciones digitales que impulsan el crecimiento de empresas. Combinamos estrategia, diseño y datos.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-6">
                            <button className="bg-octoPurpura text-white px-10 py-5 rounded-full font-bold text-xs tracking-widest hover:shadow-[0_0_30px_rgba(138,92,246,0.3)] transition-all uppercase">
                                Quiero digitalizar mi negocio
                            </button>
                            <button className="border border-white/10 text-white px-10 py-5 rounded-full font-bold text-xs tracking-widest hover:bg-white/5 transition-all uppercase">
                                Ver Soluciones
                            </button>
                        </div>
                    </motion.div>
                </div>
            </section>
        );

        const Solutions = () => {
            const items = [
                { title: "Websites", desc: "Sitios rápidos pensados para convertir visitas en clientes.", icon: "monitor" },
                { title: "E-commerce", desc: "Tiendas online optimizadas para vender sin fricción.", icon: "shopping-bag" },
                { title: "AI Agents", desc: "Agentes inteligentes que automatizan tu atención al cliente.", icon: "bot" },
                { title: "Automatización", desc: "Menos tareas manuales, más tiempo para tu negocio.", icon: "zap" }
            ];

            return (
                <section id="soluciones" className="py-32 bg-octoNegro">
                    <div className="container mx-auto px-6">
                        <div className="mb-20">
                            <h2 className="text-4xl md:text-6xl font-bold mb-6 tracking-tight">8 soluciones. <br/><span className="text-octoPurpura">Un solo objetivo.</span></h2>
                            <p className="text-octoGris max-w-xl">Ayudamos a las PyMEs a competir en la era digital con herramientas de nivel corporativo.</p>
                        </div>
                        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {items.map((item, i) => (
                                <motion.div 
                                    key={i}
                                    whileHover={{ y: -10 }}
                                    className="p-10 rounded-[2.5rem] bg-octoGrafito border border-white/5 hover:border-octoPurpura/30 transition-all group"
                                >
                                    <div className="w-12 h-12 bg-octoNegro rounded-2xl flex items-center justify-center text-octoPurpura mb-8 group-hover:scale-110 transition-transform">
                                        <Icon name={item.icon} size={24} />
                                    </div>
                                    <h3 className="text-2xl font-bold mb-4">{item.title}</h3>
                                    <p className="text-octoGris text-sm leading-relaxed">{item.desc}</p>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => (
            <section id="contacto" className="py-32 bg-octoNegro relative">
                <div className="container mx-auto px-6">
                    <div className="bg-octoGrafito rounded-[3rem] p-8 md:p-20 border border-white/5 grid lg:grid-cols-2 gap-16 items-center overflow-hidden relative">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-octoPurpura/10 blur-[100px]"></div>
                        <div className="relative z-10">
                            <h2 className="text-4xl md:text-6xl font-bold mb-8">Diseñamos hoy <br/><span className="text-octoPurpura">el futuro de tu negocio.</span></h2>
                            <p className="text-octoGris mb-10">Cuéntanos sobre tu proyecto y recibe una propuesta tecnológica personalizada en menos de 24 horas.</p>
                            <div className="flex flex-col gap-4">
                                <div className="flex items-center gap-4 text-white font-bold tracking-widest text-[10px] uppercase">
                                    <div className="w-8 h-8 rounded-full bg-octoPurpura/20 flex items-center justify-center text-octoPurpura">
                                        <Icon name="mail" size={14} />
                                    </div>
                                    hola@octo.studio
                                </div>
                            </div>
                        </div>
                        <form className="space-y-4 relative z-10">
                            <input type="text" placeholder="NOMBRE" className="w-full bg-octoNegro border border-white/10 p-5 rounded-2xl outline-none focus:border-octoPurpura transition-all text-[10px] tracking-widest" />
                            <input type="email" placeholder="EMAIL" className="w-full bg-octoNegro border border-white/10 p-5 rounded-2xl outline-none focus:border-octoPurpura transition-all text-[10px] tracking-widest" />
                            <select className="w-full bg-octoNegro border border-white/10 p-5 rounded-2xl outline-none focus:border-octoPurpura transition-all text-[10px] tracking-widest text-octoGris">
                                <option>TIPO DE PROYECTO</option>
                                <option>WEBSITE</option>
                                <option>E-COMMERCE</option>
                                <option>AGENTE AI</option>
                            </select>
                            <button className="w-full bg-octoPurpura p-6 rounded-2xl font-bold text-[10px] tracking-[0.3em] uppercase hover:bg-octoPurpura/90 transition-all">
                                Enviar mensaje
                            </button>
                        </form>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-20 border-t border-white/5 bg-octoNegro">
                <div className="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-10">
                    <div className="flex items-center gap-3">
                        <div className="w-6 h-6 bg-octoPurpura rounded-full"></div>
                        <span className="font-black tracking-[0.3em] text-white">OCTO</span>
                    </div>
                    <p className="text-octoGris text-[10px] font-bold tracking-widest uppercase">© 2025 OCTO TECHNOLOGY STUDIO. MÉXICO.</p>
                </div>
            </footer>
        );

        const App = () => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div>
                    <Navbar />
                    <Hero />
                    <Solutions />
                    <Contact />
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
